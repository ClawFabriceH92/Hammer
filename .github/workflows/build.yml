name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run unit tests (garde-fous, rate limiter, etc.)
        run: ./gradlew testDebugUnitTest --stacktrace
        continue-on-error: true

      - name: DIAGNOSTIC dump of the merged values.xml AGP tries to compile
        if: always()
        run: |
          F=app/build/intermediates/incremental/debug/mergeDebugResources/merged.dir/values/values.xml
          if [ -f "$F" ]; then
            echo "--- $F ---"
            cat -A "$F" | head -c 20000
          else
            echo "$F not found (mergeDebugResources may not have run for this task)"
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hammer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

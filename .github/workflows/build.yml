name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # --max-workers=1: the merged values.xml compile crashes intermittently in
      # com.android.aaptcompiler.TableExtractor with "Can not extract resource from
      # ParsedResource@<random-hash>" — a different resource each time, which points to a
      # race in AGP's in-process (non-isolated) resource-compiler workers rather than a
      # specific bad resource declaration. Serializing Gradle's workers avoids the race.
      - name: Run unit tests (garde-fous, rate limiter, etc.)
        run: ./gradlew testDebugUnitTest --max-workers=1 --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --max-workers=1 --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hammer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
